one-time payment, ad-free reading",premiumSubtitle:"separate Cards upgrade, lifetime access",freeCta:"Create Letter",premiumCta:"Create Cards",letterBundleAddOn:"+ unlock Letter for {price}",freeFeatures:[{text:"Ad-free Letter unlock",included:true},{text:"Photos, music, and message",included:true},{text:"Password protection",included:true},{text:"Exclusive share link",included:true},{text:"QR Code for printing",included:true},{text:"Works on any device",included:true}],premiumFeatures:[{text:"One-time payment, no subscription",included:true},{text:"Lifetime Cards access",included:true},{text:"16 exclusive interactive cards",included:true},{text:"Unlimited photos, music, and moments",included:true},{text:"Sharing via link and QR Code",included:true},{text:"All future updates",included:true}]}},faq:{eyebrow:"FAQ",headlinePrefix:"Frequently",headlineUnderline:"asked questions",items:[{question:"What is 2Luv?",answer:"2Luv is a platform to create digital love letters and personalized interactive cards. You can surprise the one you love with messages, photos, music, and unique experiences — all in a shareable link."},{question:"Is the free letter really free?",answer:"Yes! You can create a personalized love letter with photos, Spotify music, and a message without paying anything. No credit card or signup needed."},{question:"What are Interactive Cards?",answer:"They are premium experiences you add to your letter — like countdown, timeline, star map, photo gallery, word search, quiz, and many more. There are 16 exclusive card types that turn your message into something unforgettable."},{question:"How much does it cost and how does payment work?",answer:"Interactive Cards cost $ 2.99 as a one-time payment. No monthly fee, no subscription. You pay once and get lifetime access, including all future updates. We accept credit and debit cards."},{question:"How long does my link stay available?",answer:"Your Interactive Cards link stays available forever — lifetime access with no expiration date."},{question:"Can I edit my letter after creating it?",answer:"Yes! Premium users can edit their letters and cards at any time. Just access the edit panel through the same link used for creation."},{question:"Does it work on mobile?",answer:"Yes, 2Luv was built mobile-first. Both creation and viewing work perfectly on any device — smartphone, tablet, or computer."},{question:"Does the recipient need to sign up?",answer:"No! The recipient only needs to open the link. No app to download, no account to create, no login. It is an instant and accessible experience."},{question:"Is my content private?",answer:"Yes. Your letters are private and can only be accessed by whoever has the link. We do not index the content in search engines and do not share your data with third parties."},{question:"Can I share via QR Code?",answer:"Yes! Premium users can generate an exclusive QR Code for the letter. Perfect for printing on gifts, physical cards, or invitations."}],paidLetter:{items:[{question:"What is 2Luv?",answer:"2Luv is a platform for creating private digital love letters and personalized interactive cards. You can combine messages, photos, music, and memorable moments in one shareable link."},{question:"How does the Letter unlock work?",answer:"You create the Letter first, preview the cover, and complete a one-time payment to open the full content. The access stays tied to that Letter."},{question:"What are Interactive Cards?",answer:"Interactive Cards are optional add-ons for the Letter, such as countdowns, timelines, star maps, photo galleries, word searches, quizzes, and more."},{question:"How much does it cost and how does payment work?",answer:"The current Letter and Cards prices appear before checkout. You can unlock only the Letter or add Cards with the bundle discount when available. Payment is one-time, with no monthly subscription."},{question:"How long does my link stay available?",answer:"After unlock, the Letter link remains available without an expiration date, so the recipient can revisit the surprise whenever they want."},{question:"Can I edit my letter after creating it?",answer:"Yes. You can update the Letter and its details from the same creation/editing flow whenever you need to adjust the surprise."},{question:"Does it work on mobile?",answer:"Yes. 2Luv is designed mobile-first, and both creation and viewing work on smartphones, tablets, and computers."},{question:"Does the recipient need to sign up?",answer:"No. The recipient only needs to open the link. There is no app download, account creation, or login required to view the Letter."},{question:"Is my content private?",answer:"Yes. Letters are private and can only be accessed by people with the link. We do not index the content in search engines or share your data with third parties."},{question:"Can I share via QR Code?",answer:"Yes. You can share the Letter through its link or QR Code, which is useful for printing on gifts, physical cards, or invitations."}]}},blog:{eyebrow:"BLOG",headlinePrefix:"Ideas and",headlineUnderline:"inspirations",viewAll:"View All",readArticle:"Read article",placeholderPosts:[{slug:"how-to-write-a-love-letter",title:"How to write an unforgettable love letter",excerpt:"Discover practical tips for writing a love letter that will move the one you love.",categoryName:"Tips"},{slug:"creative-gift-ideas",title:"Creative gift ideas for Valentine's Day",excerpt:"Surprise with unique, personalized gifts that show all your love.",categoryName:"Inspiration"},{slug:"history-of-love-letters",title:"The history of love letters through the centuries",excerpt:"From papyrus to pixels: how love letters evolved and still move us today.",categoryName:"Culture"}]},footerCta:{headlinePrefix:"Ready to",headlineUnderline:"surprise",headlineSuffix:"?",subtitle:"Start now with a free letter or create something unforgettable with Interactive Cards.",ctaPrimary:"Start Free",ctaSecondary:"Explore Cards",paidLetter:{subtitle:"Create the Lette  detailed print-ready document about 2luv use, privacy, cookies, consent, copyright and user responsibilities.",documentType:"General 2luv policy and use document",documentTypeLabel:"Document type",generatedLabel:"Generated on",languageLabel:"Language",directionLabel:"Reading direction",scopeLabel:"Scope",contactLabel:"Contact",inventoryLabel:"Cookie and cache inventory",tocLabel:"Detailed index",metadataTitle:"Document metadata",overviewTitle:"2luv overview",printButtonLabel:"Print or save PDF",printInstruction:"Use the browser print dialog and choose Save as PDF to download a copy.",policiesTitle:"Included policies",consentMatrixTitle:"Consent categories",scope:"Terms of Service, Privacy Policy, Cookie Policy, Copyright, storage technologies and consent controls used by 2luv.",overview:"2luv lets people create digital letters and gifts with text, photos, music, shareable links and visual features. This document consolidates the public policies so users can understand responsibilities, privacy, cookies, copyright, payments, security and consent choices.\n\nThe information below is generated from the currently published localized legal content and from the technical inventory of cookies, local storage, caches and embeds used by 2luv.",consentMatrixIntro:"2luv uses internal consent categories aligned with Google Consent Mode V2.",serviceLabel:"Service",categoryHeader:"Category",purposeHeader:"Purpose",consentModeHeader:"Consent Mode V2",choiceHeader:"Choice",necessaryCategory:"Necessary",necessaryPurpose:"Security, essential operation, draft recovery and protected access.",preferencesCategory:"Preferences",preferencesPurpose:"Language, region, theme and interface choices.",analyticsCategory:"Analytics",analyticsPurpose:"Aggregate usage and performance measurement when allowed.",marketingCategory:"Marketing and embeds",marketingPurpose:"Campaign attribution, conversions and third-party media previews when allowed.",alwaysOn:"Always on",optionalChoice:"Optional"}},terms:{title:"Terms of Service — 2luv Terms & Conditions",subtitle:"Please read these terms before using 2luv.",description:"Learn about 2luv's terms of service, conditions of use, and policies. Transparency and security for creating your digital love letters.",lastUpdatedLabel:"Last Updated",lastUpdatedDate:"2026-01-03",simpleTitle:"In simple words",tocTitle:"Index",tocIntro:"In simple words",tocOfficial:"Official section",tocContact:"Contact",backToTop:"Back to top",welcome:"2luv lets you create a digital love letter / gift (a \"Gift\") with text, photos, music, and a shareable link.\n\nYou control who you share your Gift link with. Important: if you do not enable password protection, anyone with the link can view the Gift content and images — be careful when sharing.\n\nPublic/showcase pages display only sample demo letters created by the 2luv team; your Gifts are not published there.\n\nBy using 2luv, you agree to these Terms and our Privacy Policy.",contactInfo:"For specific questions about these terms, please visit the",contactPage:"contact page",close:"Close",sections:[{id:"acceptance",icon:"BookOpen",title:"1. Acceptance and definitions",content:"By accessing or using 2luv, you agree to these Terms and the Privacy Policy. If you do not agree, do not use the Service.\n\n2luv is not directed to individuals under 18 years old (or the age of majority in your jurisdiction). We do not knowingly collect data from children or minors. If we become aware that a minor's data was collected without valid parental/legal guardian consent (when applicable), we will promptly delete such information.\n\nIn these Terms, \"Gift\" means the digital page/letter you create; \"Content\" includes text, images, photos, music/links and other data you provide; \"Service\" means the 2luv website and features."},{id:"service",icon:"FileLock2",title:"2. What 2luv provides",content:"2luv lets you create and share personalized Gifts (for example: love letters, tributes, birthdays, special dates), including features like text, photos, QR code/shareable link and visual customization.\n\nSome features may depend on the plan you choose (for example, Gift duration/validity, premium themes and other premium features)."},{id:"gifts",icon:"Scale",title:"3. Creating, accessing, and sharing Gifts",content:"You are responsible for the Content you upload and the information you include in a Gift (for example: names, messages, photos, dates and other details).\n\nAccess to a Gift happens through a shareable link. If you enable password protection, you are responsible for setting and keeping that password safe. We do not store the password in plain text (it is handled securely, e.g., hashed).\n\nImportant: if you do not enable password protection, anyone with the link can view the Gift content and images. Only share the link with people you trust.\n\nPublic/showcase pages display only sample demo letters created by the 2luv team; your Gifts are not published on those pages."},{id:"user-content",icon:"AlertCircle",title:"4. Your content and licenses",content:"You retain ownership of your Content.\n\nTo operate the Service (hosting, storing, processing, displaying and delivering your Gift), you grant us a limited, non-exclusive, worldwide license to use your Content only as necessary to provide the Service and comply with legal obligations.\n\nYou represent that you have the rights and permissions required to publish the Content (for example: photos of other people, music, and copyrighted material)."},{id:"content-responsibility",icon:"AlertCircle",title:"4.1. Responsibility for user content",content:"2 PROJECTS LTDA does not perform prior monitoring of messages and images sent by users. The User is solely and exclusively responsible for the content transmitted, ensuring they hold the necessary copyrights/permissions for the images and that the message does not violate honor-related laws (for example, defamation, slander, or insult) or third-party rights.\n\nIn simple words: you are the owner and the only responsible party for the photos and texts you upload. Make sure you have permission to use the images and that your message is respectful and lawful."},{id:"privacy-cookies",icon:"Zap",title:"5. Privacy, cookies, and data",content:"How we handle personal data (for example: email, optional phone number, IP/technical identifiers, and usage data) is described in our Privacy Policy.\n\nWe use cookies and similar technologies for site functionality, security, metrics and, when applicable, marketing/analytics. You can manage cookies in your browser settings, but some features may not work properly.\n\nWe may use third-party providers to host and operate the Service (for example: payments, storage, analytics), sharing data only as necessary and as described in the Privacy Policy.\n\nInternational data transfers: to provide our global services, 2luv may transfer your personal data to other countries. In such cases, we apply robust safeguards such as Standard Contractual Clauses (SCCs) approved by the European Commission and measures aligned with Brazil's LGPD to ensure an equivalent level of data protection regardless of where processing occurs.\n\nData subject rights: regardless of your location, you may have the following rights, as applicable: Access and Confirmation (know whether we process your data); Rectification (correct incomplete or inaccurate data); Deletion/Erasure (request deletion, subject to legal limits); Data Portability (receive your data in a structured format to transfer to another service); Objection (object to processing based on legitimate interests or direct marketing). To exercise these rights, contact us at: contact@2luv.com."},{id:"payments",icon:"LifeBuoy",title:"6. Payments, plans, and access",content:"Some 2luv features may require payment. Payments are processed by payment providers (e.g., Stripe) and may be subject to additional terms from those providers.\n\nPrices may vary by currency/region and may include taxes when applicable. By completing a purchase, you authorize the charge and agree to provide valid payment information.\n\nIf you have billing or post-purchase access issues, contact support so we can review your case."},{id:"prohibited",icon:"BookOpen",title:"7. Acceptable use and prohibited content",content:"You agree not to use 2luv for illegal, deceptive, abusive, offensive, discriminatory, harassing activities, or to infringe third-party rights.\n\nYou must not publish or share content that infringes copyrights/trademarks, violates privacy, includes sensitive personal data without permission, or contains malware/spam."},{id:"moderation",icon:"FileLock2",title:"8. Moderation, removals, and suspension",content:"We may remove or restrict Gifts/Content that violate these Terms, create risk to the Service, or when required by law.\n\nYou may delete your Gift when this option is available in the product. Deletion may not immediately remove security/backup copies, which are retained only as needed for integrity and legal purposes.\n\nWe may suspend access in cases of abuse, fraud, violations of these Terms, or to protect the platform and other users."},{id:"availability",icon:"Scale",title:"9. Availability and limitations",content:"We work to keep the Service available and secure, but we do not guarantee uninterrupted or error-free operation. The Service may undergo maintenance, downtime, and feature changes.\n\nTo the maximum extent permitted by applicable law, 2luv is not liable for indirect, incidental, consequential damages or lost profits arising from your use (or inability to use) the Service."},{id:"governing-law-venue",icon:"Scale",title:"9.1. Governing law and venue",content:"These Terms are governed by the laws of the Federative Republic of Brazil.\n\nFor users located in Brazil, the chosen venue is the courts of the District of Imperatriz, State of Maranhão, Brazil.\n\nFor international users, disputes may be resolved in accordance with consumer protection rules in your local jurisdiction, with priority given to amicable resolution through 2luv support channels.\n\nIn simple words: we aim to resolve issues amicably first; if not possible, legal rules and venue may vary depending on your jurisdiction and applicable law."},{id:"contact",icon:"AlertCircle",title:"10. Contact",content:"For questions, privacy requests, reports, and support, please contact us via the contact page."}]},copyright:{title:"Copyright & Intellectual Property (DMCA)",intro:"This page explains how 2luv content, design, and software are protected and how to report unauthorized copies (including DMCA/takedown guidance when applicable).",warning:{title:"Plagiarism notice",body:"Copying, reproducing, cloning, or imitating 2luv (including layout, visual identity, copy/text, features, user flows, and/or code) without authorization is prohibited.\n\nWe may take appropriate administrative and legal actions, including takedown requests under applicable laws (e.g., DMCA, when relevant) and other measures to protect our intellectual property."},sections:[{id:"intellectual-property",title:"1. Intellectual Property",content:"All 2luv content (including text, materials, trademarks, layout, visual identity, design, and overall \"look and feel\"), as well as the software behind the platform (code, APIs, components, logic, databases, and flows), is protected by copyright and other intellectual property laws.\n\nUnless expressly authorized in writing, you may not copy, reproduce, modify, distribute, republish, reverse engineer, create derivative works from, or commercially exploit any part of 2luv."},{id:"reporting",title:"2. Reporting infringement or plagiarism",content:"If you believe your content (or ours) is being used without authorization, gather evidence (links/URLs, screenshots, dates, identifiers, and a clear description of what was copied).\n\nSend your report with as much detail as possible to the email below. When applicable, we may submit takedown requests to the relevant providers, platforms, and/or marketplaces."},{id:"dmca-notice",title:"3. DMCA (takedown procedure — when applicable)",content:"The DMCA (Digital Millennium Copyright Act) is a U.S. law that provides a formal process for removing infringing content from online services. Even if you are not in the U.S., some platforms and hosting providers follow this process.\n\nA DMCA notice typically includes: identification of the copyrighted work; identification of the allegedly infringing material (with URL); your contact information; a good-faith statement; and a statement under penalty of perjury that the information is accurate and that you are the owner (or authorized to act on behalf of the owner)."}],dmca:{title:"Contact for reports / DMCA",emailLabel:"Email",email:"contact@2-luv.com",emailHint:"Include links, screenshots, and dates to speed up review."}},cookies:{title:"Cookie Policy — Consent & Preferences",subtitle:"Learn how we use cookies, what types exist, and how you can manage your consent.",lastUpdatedLabel:"Last updated",lastUpdatedDate:"2026-01-02",sections:[{id:"cookies-what",title:"1. What cookies are and how we use them",content:"Cookies are small text files stored by your browser when you visit a website. They help remember preferences, keep essential features working, and—when you allow it—measure performance and campaign effectiveness.\n\nAt 2luv, we use cookies mainly to: (a) remember your consent, (b) provide features and security on some pages (e.g., password-protected content), and (c) when authorized, measure usage and conversions."},{id:"cookies-types",title:"2. Types of cookies used and purpose",content:"Necessary: essential for security and basic functionality (e.g., remembering consent and authenticating protected content).\n\nFunctional: improve your experience and help navigation (e.g., remembering the last accessed content).\n\nPreferences: store choices like language.\n\nAnalytics: help measure and understand site usage (statistics), when enabled.\n\nMarketing: help measure campaigns and conversions, when enabled."},{id:"cookies-consent",title:"3. How we collect your consent and how long it is stored",content:"When you access 2luv, we show a cookie banner so you can accept, reject, or customize your preferences (e.g., Analytics and Marketing).\n\nYour choice is stored so we can respect it on future visits. In general, we keep the record for up to 12 months (it may vary depending on browser settings). In some cases, we also use the browser's localStorage to store preferences."},{id:"cookies-refuse",title:"4. How you can refuse cookies",content:"You can refuse optional cookies directly in the banner by clicking Reject or by disabling categories in Customize.\n\nYou can also manage cookies in your browser settings (block, delete, or limit). If you delete cookies, some preferences may be reset."},{id:"cookies-table",title:"5. Which cookies are used",content:"The list below includes first-party cookies (set by 2luv) and cookies/identifiers that may be set by third-party services (Analytics/Ads). Some names and durations may vary depending on the provider and browser."},{id:"cookies-rights",title:"6. How to exercise your rights",content:"You can request information and exercise your privacy rights (for example: confirmation of processing, access, correction, anonymization, portability, deletion, and withdrawal of consent), when applicable, by contacting us.\n\nContact channel: contact@2-luv.com."},{id:"cookies-changes",title:"7. Changes and modification date of the Cookie Policy",content:"We may update this Cookie Policy to reflect changes in our services, technologies, or legal obligations. When there are relevant changes, we will update the “Last updated” date at the top of this page."}],table:{caption:"Relevant cookies and identifiers",legacyFallback:"legacy fallback",headers:{site:"Site",classification:"Category",cookie:"Cookie",purpose:"Purpose",duration:"Duration",domain:"Domain",technology:"Technology",owner:"Owner",name:"Name",consentMode:"Consent mode",cleanup:"Cleanup"},rows:[{classification:"necessary",cookie:"cookie-consent",purpose:"Stores your consent choice (including Consent Mode preferences) so we can respect your selections in future visits.",duration:"12 months"},{classification:"necessary",cookie:"2luv-locale / NEXT_LOCALE (legacy fallback)",purpose:"Keeps the service in the correct language, date format and reading direction for this browser.",duration:"12 months"},{classification:"necessary",cookie:"2luv-region / user-region (legacy cleanup)",purpose:"Keeps pricing, currency, plan availability and regional routing consistent for this browser.",duration:"12 months"},{classification:"functional",cookie:"created_gifts",purpose:"Helps remember gifts/letters created in this browser (e.g., quick recovery and navigation convenience).",duration:"180 days"},{classification:"functional",cookie:"last_accessed_gift",purpose:"Helps quickly resume the last gift/letter accessed in this browser.",duration:"30 days"},{classification:"necessary",cookie:"device_id",purpose:"Security cookie (httpOnly) used to identify the device/browser and help protect access and sensitive operations.",duration:"12 months"},{classification:"necessary",cookie:"gift_auth_{giftId}",purpose:"Authentication cookie (httpOnly) used to keep access to password-protected letters and allow authorized actions related to that content.",duration:"30 days"},{classification:"analytics",cookie:"_ga / _ga_*",purpose:"Google Analytics: helps understand site usage (aggregated statistics), performance, and navigation, respecting Consent Mode.",duration:"up to 13 months"}],classifications:{necessary:"Necessary",functional:"Functional",preferences:"Preferences",analytics:"Analytics",marketing:"Marketing"},technologies:{cookie:"Cookie",localStorage:"localStorage",sessionStorage:"sessionStorage",indexedDB:"IndexedDB","http-cache":"HTTP cache","cdn-cache":"CDN cache","server-memory":"Server memory",database:"Database",embed:"Third-party embed","query-identifier":"Query identifier"}}},privacy:{title:"Privacy Policy — Data Protection & Privacy",subtitle:"Understand how we collect, use, and protect your personal information.",lastUpdatedLabel:"Last Updated",lastUpdatedDate:"2026-01-01",tocTitle:"Index",tocIntro:"In simple words",tocOfficial:"Official section",tocContact:"Contact",simpleTitle:"In simple words",welcome:"At 2luv, we use your data to create and deliver your Gift and to process payments (via Stripe). If you accept marketing/analytics cookies, we also use measurement technologies (pixels/tags) to understand campaign performance and conversion attribution. You can change your consent at any time.\n\nPublic/showcase pages display only sample demo letters created by the 2luv team.",contactHeading:"Contact",contactText:"For questions, see our",contactPage:"contact page",close:"Close",sections:[{id:"who-we-are",icon:"Users",title:"1. Who we are and scope",content:"This Privacy Policy explains how 2luv collects, uses, and shares personal data when you use our website and services (for example, when you create, view, and share a Gift, or when you complete a purchase).\n\nAccess and sharing: Gifts are accessed via a link. If you share that link (and especially if there is no password), anyone with the link can view the Gift content and images.\n\nPublic/showcase pages display only sample demo letters created by the 2luv team.\n\n\"Personal data\" refers to information that identifies you directly or that may identify you indirectly when combined with other data (for example, online identifiers and usage data)."},{id:"data-collected",icon:"Database",title:"2. What data we collect",content:"Data you provide: information submitted when creating a Gift (for example, name, email, phone number (if provided), and the Gift content, including messages and any media you upload).\n\nPayment data: payments are processed by providers such as Stripe. We generally do not store full card details; we receive what we need to confirm the transaction and unlock access (for example, payment status, currency/amount, and session/order identifiers).\n\nUsage and technical data: we may collect information such as IP address, browser/device type, pages visited, timestamps, error logs, and similar information for security, fraud prevention, and service improvement.\n\nMarketing/attribution identifiers (when permitted): we may record campaign and click parameters (for example, UTM, gclid/fbclid/ttclid/epik) for attribution and conversion measurement to measure performance and attribute conversions."},{id:"data-usage",icon:"Shield",title:"3. How we use your data",content:"Service delivery: create, host, render, and make your Gift available, including core product functionality.\n\nPayments and access: process purchases, verify payments, meet accounting/financial obligations, and unlock paid features.\n\nSupport and communications: respond to requests, investigate issues, and maintain support records.\n\nSecurity and fraud prevention: monitor abusive behavior, protect sessions, detect suspicious activity, and maintain platform integrity.\n\nMeasurement and marketing (with consent, when applicable): measure campaigns, attribute conversions, and avoid duplicate reporting between client-side and server-side events."},{id:"legal-bases",icon:"Gavel",title:"4. Legal bases (where applicable)",content:"Depending on your location, we may process personal data based on: (i) contract performance (to provide the Gift and paid features), (ii) legal obligations (for example, financial recordkeeping), (iii) legitimate interests (for example, security, fraud prevention, and improving the service, balanced against your rights), and (iv) consent (for example, marketing/analytics cookies and tags where required).\n\nYou can withdraw your consent at any time, without affecting the lawfulness of processing carried out before withdrawal."},{id:"cookies-storage",icon:"Cookie",title:"5. Cookies, local storage, and similar technologies",content:"We use cookies and local storage to operate the site and remember preferences.\n\nEssential: used for security, core site operation, and to remember your consent choice (consent cookie).\n\nOptional (configurable in the banner):\n- Analytics: helps us understand site usage and performance (statistics).\n- Ads measurement: helps measure campaigns and conversions.\n- Ad user data: allows sending user data to improve conversion measurement (where applicable).\n- Ad personalization: allows remarketing/personalized ads.\n\nFor Google signals, we use Google Consent Mode v2: optional signals start as denied by default and are only updated after your choice. You can change your consent at any time.\n\nYou can delete cookies and local data in your browser settings. Note that some features may rely on them to work correctly."},{id:"ads-conversions",icon:"Megaphone",title:"6. Advertising, pixels, and conversions (client and server)",content:"If you provide consent, we may load Google Tag/Ads to record page views and events and understand campaign performance. We do not load Meta Pixel, Pinterest Tag, or TikTok Pixel.\n\nIn addition to browser-based Google measurement, we may also send server-side conversion events (for example, after payment confirmation via webhooks) to configured advertising platforms for measurement and attribution. These events may include technical and attribution identifiers (for example, click parameters) and, where applicable, pseudonymized data (for example, hashed email/phone) to improve matching.\n\nWe do not sell your personal data. We use these events primarily for measurement and to reduce duplicates (deduplication) between client and server events."},{id:"sharing",icon:"Handshake",title:"7. Who we share data with",content:"Service providers: we may share data with vendors that help us operate 2luv (for example, hosting/infrastructure, payment processing such as Stripe, and support tools), only as necessary to deliver the service.\n\nMeasurement/ads partners (with consent, where applicable): we may share identifiers and conversion events with advertising platforms for measurement and attribution.\n\nLegal and protection: we may disclose data when required by law or to protect rights, safety, and prevent fraud/abuse."},{id:"retention",icon:"Timer",title:"8. Data retention",content:"We keep data for as long as needed to fulfill the purposes described in this policy, including legal compliance, dispute resolution, and security.\n\nSome product cookies may last up to 1 year. Financial records may be retained longer where required by law."},{id:"rights",icon:"Scale",title:"9. Your rights and choices",content:"You can: (i) manage cookies and withdraw consent in your site/browser settings, (ii) request access, correction, deletion, or portability (where applicable), and (iii) object to or restrict certain processing (where applicable).\n\nTo exercise your rights, contact us. You may also have the right to lodge a complaint with a data protection authority, depending on your location."},{id:"security",icon:"Lock",title:"10. Security",content:"We apply reasonable technical and organizational measures to protect your data. However, no system is 100% secure; we recommend using trusted devices and networks when accessing 2luv."},{id:"international",icon:"Globe2",title:"11. International transfers",content:"Our providers and partners may operate in different countries. Where international transfers occur, we use appropriate safeguards required by applicable law (for example, standard contractual clauses and risk assessments) to protect your information."},{id:"children",icon:"Baby",title:"12. Children",content:"2luv is not intended for children. If you believe a child has provided personal data to us, contact us so we can take appropriate action."},{id:"changes",icon:"RefreshCcw",title:"13. Changes to this policy",content:"We may update this Privacy Policy from time to time. The most recent version will be available on this page, and the effective date will be updated when relevant changes occur."}]},payment:{sessionNotFound:"Session not found",sessionError:"We couldn't locate the details of your payment session.",backHome:"Back to home page",confirming:"Confirming your payment",verifying:"We are verifying your transaction details. This will only take a moment...",backToHome:"Back to home",viewMyGift:"View my gift",redirecting:"Redirecting to your gift...",networkError:"Could not confirm payment due to a network issue.",notConfirmed:"Payment not confirmed yet.",notConfirmedTitle:"Payment not confirmed",waitingConfirmation:"Waiting for confirmation...",noAdsSuccessTitle:"Ads removed!",noAdsSuccessSubtitle:"Your Letter is now ad-free.",backToLetter:"Back to Letter",confirmation:{paymentConfirmed:"Payment Confirmed",tributeReady:"Your tribute is ready to be viewed",verificationError:"Verification Error",backToHome:"Back to home",giftReady:"Your gift is ready",openingGift:"Opening gift",viewMyGift:"View my gift",paid:"Paid",paymentNotConfirmed:"Payment not confirmed",communicationError:"Communication error while verifying payment."},backToGift:"Back to Gift",letterSuccessTitle:"Letter unlocked!",letterSuccessSubtitle:"Your Letter is unlocked and ad-free.",successAnimation:{confirmed:"Payment confirmed",verifying:"Confirming payment"}},paymentSheet:{eyebrow:"Secure payment",title:"Complete unlock",description:"Choose how you want to pay for this 2luv product.",productsLabel:"Products",methodsLabel:"Payment method",visualOnly:"Secure checkout with automatic confirmation.",continueCta:"Continue with {{method}}",summary:{oneTime:"One-time payment",oneTimeFullAccess:"One-time payment · Full access",oneTimeLifetime:"One-time · Lifetime access",coupon:"Have a coupon?",disabled:"This option is not available yet.",freeUnlock:"Unlock for free"},methods:{pix:"Pix",stripe:"Card / Stripe"},kinds:{letter:"letter
